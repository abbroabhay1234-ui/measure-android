name: Build Android Measure APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Fix line endings and make gradlew executable
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug 2>&1 | tee build.log || {
            echo "====================== ERROR SUMMARY ======================"
            grep -A 20 -B 2 "What went wrong" build.log || tail -n 40 build.log
            echo "==========================================================="
            exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Measure-Android-APK
          path: "app/build/outputs/apk/debug/*.apk"
